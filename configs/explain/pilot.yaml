# Pilot of the explanation-utility experiment (explain/pilot.py).
# Budget: $2k for the whole pilot (claude/AGENTS.md); the API cap below leaves
# room for GPU time.
# Paths are on the pilot's PVC; explain/cluster/run.sh sets them up.
workdir: /data/work/pilot
seed: 20261006
positions: 100
stockfish: /data/bin/stockfish
oracle_nodes: 200000
oracle_workers: 8

# Released Queen checkpoint and its own analysis prompt (inference_config.json).
queen_model: /data/models/queen_hce-4
queen_prompt: "Analyze the given chess position, identify the best move, give the critical line assuming best play, list promising moves for deeper investigation, and evaluate the position."
qwen_model: /data/models/Qwen3.8-27B

max_api_spend_usd: 1500
api_workers: 16

models:
  opus:
    provider: anthropic
    model: claude-opus-5-5
    price_in: 4.0
    price_out: 20.0
    effort: medium
  sonnet:
    provider: anthropic
    model: claude-sonnet-5-5
    price_in: 2.0
    price_out: 10.0
    effort: medium      # Sonnet 5.5 defaults to high; pinned to match Opus
  flash:
    provider: gemini
    model: gemini-3.8-flash          # TODO(owner): confirm the model id
    price_in: null                   # TODO(owner): USD per million input tokens
    price_out: null                  # TODO(owner): USD per million output tokens
    effort: medium
    thinking_levels: {low: low, medium: null, high: high}   # null = provider default

roles:
  reference_reader: opus          # reads every text; the yardstick for substitutions
  readers: [opus, sonnet, flash]
  choosers: [opus, sonnet, flash]
  hybrid_writers: [opus, sonnet, flash]
  external_consolidators: [opus, sonnet, flash]

effort_sweep:
  opus: [low, high]
  sonnet: [low, high]
  flash: [low, high]

# Output tokens per call (thinking included), used only to project spend
# before a run; replaced by measured values in the report.
projected_output_tokens:
  reader: 2000
  chooser: 2000
  writer: 3500
  consolidator: 4000
  rewrite: 3500

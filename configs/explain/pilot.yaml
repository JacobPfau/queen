# Pilot of the explanation-utility experiment (explain/pilot.py).
# Budget: $2k for the whole pilot (claude/AGENTS.md); the API cap below leaves
# room for GPU time.
# Paths are on the pilot's PVC; explain/cluster/run.sh sets them up.
workdir: /data/work/pilot
seed: 20261006
positions: 100
stockfish: /data/bin/stockfish
oracle_nodes: 200000
oracle_workers: 8

# Queen = PAWN-8, the paper's final model (2697 Elo; arXiv 2610.03695), with its
# own prompt from the release's inference_config.json. HCE-4 is the paper's
# handcrafted-evaluation ablation (at most 2497 Elo).
queen_model: /data/models/queen_pawn-8
queen_prompt: "Analyze the position carefully and find the best move for player."
qwen_model: /data/models/Qwen3.8-27B

max_api_spend_usd: 1500
api_workers: 16

models:
  opus:
    provider: anthropic
    model: claude-opus-5-5
    price_in: 4.0
    price_out: 20.0
    effort: medium
  sonnet:
    provider: anthropic
    model: claude-sonnet-5-5
    price_in: 2.0
    price_out: 10.0
    effort: medium      # Sonnet 5.5 defaults to high; pinned to match Opus
  flash:
    provider: gemini
    model: gemini-3.8-flash          # newest Flash per ai.google.dev pricing, checked 2026-10-06
    price_in: 0.75                   # promotional rate through 2026-12-31; $1.50 from 2027
    price_out: 3.75                  # thinking included; doubles from 2027
    effort: medium
    thinking_levels: {low: low, medium: medium, high: high}   # medium is also the API default

roles:
  reference_reader: opus          # reads every text; the yardstick for substitutions
  readers: [opus, sonnet, flash]
  choosers: [opus, sonnet, flash]
  hybrid_writers: [opus, sonnet, flash]
  external_consolidators: [opus, sonnet, flash]

effort_sweep:
  opus: [low, high]
  sonnet: [low, high]
  flash: [low, high]

# Output tokens per call (thinking included), used only to project spend
# before a run; replaced by measured values in the report.
projected_output_tokens:
  reader: 2000
  chooser: 2000
  writer: 3500
  consolidator: 4000
  rewrite: 3500
